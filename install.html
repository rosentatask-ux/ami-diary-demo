<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阿咪日记 · 怎么装到手机</title>
  <style>
    body { font-family: "Noto Sans SC", sans-serif; background: #f3eee6; color: #2f3430; margin: 0; padding: 24px 18px 48px; line-height: 1.6; }
    main { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 1.5rem; }
    a.btn { display: block; text-align: center; background: #2f3430; color: #f7f3eb; text-decoration: none; padding: 12px; border-radius: 999px; margin: 16px 0 24px; }
    section { background: #fffcf7; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
    ol { padding-left: 1.2em; }
    .note { font-size: 0.85rem; color: #6a5e4e; }
  </style>
</head>
<body>
  <main>
    <h1>装到手机，日记才稳</h1>
    <p class="note">请只用下面这一个试用页。换链接等于换了一份空白记忆。不花钱买云，数据在本机。</p>
    <a class="btn" href="./index.html">打开阿咪日记</a>
    <section>
      <h2>iPhone（不上架也能用）</h2>
      <ol>
        <li>用 <strong>Safari</strong> 打开试用页（微信里请选「在 Safari 打开」）</li>
        <li>点底部分享</li>
        <li>「添加到主屏幕」</li>
        <li>以后只点主屏幕图标，不要再从聊天记录里乱点别的链接</li>
        <li>重要回忆点左下「导出」，存进「文件」App</li>
      </ol>
    </section>
    <section>
      <h2>安卓</h2>
      <ol>
        <li>有 APK 就直接安装（允许未知来源）</li>
        <li>没有安装包时：Chrome 打开试用页 → 菜单「安装应用」</li>
        <li>同样请「导出」一份备份到文件管理器</li>
      </ol>
    </section>
  </main>
</body>
</html>
